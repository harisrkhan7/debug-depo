<text x="950" y="352" fill="#172033" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Neither</text>
<text x="300" y="382" fill="#172033" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="700">SWE-smith confirmation</text>
<text x="800" y="382" fill="#172033" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="700">SWE-bench Verified</text>
<text x="80" y="425" fill="#172033" font-family="Arial, sans-serif" font-size="17" font-weight="700">B. No-patch attempts consume a disproportionate token share</text>
<text x="80" y="448" fill="#536176" font-family="Arial, sans-serif" font-size="13">Bars compare their share of tasks with their share of all DEPO tokens.</text>
