<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 740" role="img" aria-labelledby="title desc">
<title id="title">Drivers of the DEPO token difference</title>
<desc id="desc">Aggregate paired token changes by resolution transition and the token share of no-patch attempts in both evaluations.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="80" y="34" fill="#172033" font-family="Arial, sans-serif" font-size="22" font-weight="700">What drives DEPO&#x27;s token difference?</text>
<text x="80" y="59" fill="#536176" font-family="Arial, sans-serif" font-size="13">All changes are DEPO minus SFT; green is a saving and orange is additional spend.</text>
<text x="80" y="92" fill="#172033" font-family="Arial, sans-serif" font-size="17" font-weight="700">A. Aggregate total-token change by paired outcome</text>
<line x1="80" y1="308.0" x2="1020" y2="308.0" stroke="#dbe3ec" stroke-width="1"/>
<text x="70" y="312.0" fill="#172033" font-family="Arial, sans-serif" font-size="11" text-anchor="end">-20M</text>
<line x1="80" y1="264.0" x2="1020" y2="264.0" stroke="#dbe3ec" stroke-width="1"/>
<text x="70" y="268.0" fill="#172033" font-family="Arial, sans-serif" font-size="11" text-anchor="end">-10M</text>
<line x1="80" y1="220.0" x2="1020" y2="220.0" stroke="#172033" stroke-width="1.5"/>
<text x="70" y="224.0" fill="#172033" font-family="Arial, sans-serif" font-size="11" text-anchor="end">+0M</text>
<line x1="80" y1="176.0" x2="1020" y2="176.0" stroke="#dbe3ec" stroke-width="1"/>
<text x="70" y="180.0" fill="#172033" font-family="Arial, sans-serif" font-size="11" text-anchor="end">+10M</text>
<line x1="80" y1="132.0" x2="1020" y2="132.0" stroke="#dbe3ec" stroke-width="1"/>
<text x="70" y="136.0" fill="#172033" font-family="Arial, sans-serif" font-size="11" text-anchor="end">+20M</text>
<rect x="121" y="220.0" width="58" height="5.9" rx="3" fill="#059669"/>
<text x="150" y="243.9411792" fill="#059669" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="700">-1.35M</text>
<text x="150" y="352" fill="#172033" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Both solved</text>
<rect x="221" y="220.0" width="58" height="5.0" rx="3" fill="#059669"/>
<text x="250" y="242.99205519999998" fill="#059669" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="700">-1.13M</text>
<text x="250" y="352" fill="#172033" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">DEPO-only</text>
