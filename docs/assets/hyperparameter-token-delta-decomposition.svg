<text x="650" y="352" fill="#172033" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Both solved</text>
<rect x="721" y="220.0" width="58" height="80.2" rx="3" fill="#059669"/>
<text x="750" y="318.238818" fill="#059669" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="700">-18.24M</text>
<text x="750" y="352" fill="#172033" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">DEPO-only</text>
<rect x="821" y="137.3" width="58" height="82.7" rx="3" fill="#c25b22"/>
