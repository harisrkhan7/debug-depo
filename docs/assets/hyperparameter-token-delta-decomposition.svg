<text x="245" y="608.24" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="700">3.6%</text>
<text x="245" y="662" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Task share</text>
<rect x="314" y="498.5" width="62" height="141.5" rx="3" fill="#c25b22"/>
<text x="345" y="490.47782606479166" fill="#c25b22" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="700">21.4%</text>
<text x="345" y="662" fill="#c25b22" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Token share</text>
<text x="295.0" y="696" fill="#172033" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="700">SWE-smith confirmation</text>
<text x="295.0" y="719" fill="#92400e" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">+41.60M vs SFT</text>
<rect x="674" y="599.1" width="62" height="40.9" rx="3" fill="#94a3b8"/>
<text x="705" y="591.08" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="700">6.2%</text>
<text x="705" y="662" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Task share</text>
