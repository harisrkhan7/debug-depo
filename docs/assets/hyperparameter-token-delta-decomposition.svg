<text x="350" y="179.36541119999998" fill="#c25b22" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="700">+7.42M</text>
<text x="350" y="352" fill="#172033" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">SFT-only</text>
<rect x="421" y="115.1" width="58" height="104.9" rx="3" fill="#c25b22"/>
<text x="450" y="107.051794" fill="#c25b22" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="700">+23.85M</text>
<text x="450" y="352" fill="#172033" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Neither</text>
<rect x="621" y="220.0" width="58" height="59.8" rx="3" fill="#059669"/>
